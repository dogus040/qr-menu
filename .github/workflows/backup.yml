name: Nachtelijke backup

# Elke nacht 04:30 (Istanbul): menudata uit D1 als JSON in de repo
# (backup/menu.json) en de reservekopie voor de menukaart (public/snapshot.json).
# Geen e-mailadressen of log: die blijven alleen in D1 / Cloudflare Access.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/backup.ts --remote
      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/menu.json public/snapshot.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Nachtelijke backup menu"
            git push
          fi
