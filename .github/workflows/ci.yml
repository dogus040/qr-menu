name: CI

on:
  push:
    branches: [main, "redesign/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Alleen vanaf main: database-migraties en de beheer-Worker uitrollen.
  # De publieke menukaart (Pages) wordt door Cloudflare zelf vanaf GitHub gebouwd.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Time Travel-bladwijzer vóór migratie (voor herstel)
        run: npx wrangler d1 time-travel info bimola
      - run: npx wrangler d1 migrations apply bimola --remote
      - run: npx wrangler deploy -c wrangler.admin.jsonc
