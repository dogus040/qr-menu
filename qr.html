<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR kaartjes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #2b2118; --soft: #6f5f4d; --accent: #8a2c1c; --gold: #a8844f; --line: #d6c4a5; --card: #fbf7ef; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ece4d6; color: var(--ink); font-family: "Lora", Georgia, serif; }
    .tools { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; display: grid; gap: 12px; }
    .tools h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 22px; margin: 0; }
    .tools p { margin: 0; color: var(--soft); font-size: 14px; }
    .tools label { display: grid; gap: 4px; font-size: 14px; }
    .tools input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; width: 100%; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .buttons button { font: inherit; font-size: 15px; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
    .buttons button.secondary { background: transparent; color: var(--accent); }

    .sheet { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; max-width: 760px; margin: 16px auto 40px; padding: 0 16px; }
    .card { background: var(--card); text-align: center; padding: 28px 22px 24px; position: relative; aspect-ratio: 105 / 148; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); outline: 1px solid var(--line); outline-offset: 3px; pointer-events: none; }
    .card .orn { color: var(--gold); font-size: 22px; line-height: 1; }
    .card .name { font-family: "Playfair Display", Georgia, serif; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 26px; margin: 8px 0 2px; }
    .card .sub { font-style: italic; color: var(--soft); font-size: 14px; margin: 0 0 14px; }
    .card canvas { width: 62%; height: auto; image-rendering: pixelated; }
    .card .cta { font-family: "Playfair Display", Georgia, serif; color: var(--accent); font-size: 18px; margin: 14px 0 0; }
    .card .table { font-size: 13px; color: var(--soft); margin-top: 6px; min-height: 1em; }

    @media print {
      @page { size: A4; margin: 8mm; }
      body { background: none; }
      .tools { display: none; }
      .sheet { grid-template-columns: 1fr 1fr; gap: 6mm; max-width: none; margin: 0; padding: 0; }
      .card { break-inside: avoid; border: 0.2mm dashed #bbb; }
    }
  </style>
</head>
<body>
  <section class="tools">
    <h1>QR-kaartjes voor op tafel</h1>
    <p>Controleer de link, druk op Afdrukken (4 kaartjes per A4, A6-formaat) of download de QR-code als afbeelding.</p>
    <label>Link naar de menukaart
      <input id="url" type="url" spellcheck="false">
    </label>
    <label>Tekst onder de QR-code
      <input id="cta" type="text" value="Menü için QR kodu okutun">
    </label>
    <label>Tafelnummer (optioneel, bijv. "Masa 5")
      <input id="table" type="text" value="">
    </label>
    <div class="buttons">
      <button id="print" type="button">Afdrukken</button>
      <button id="download" type="button" class="secondary">QR downloaden (PNG)</button>
    </div>
  </section>

  <main id="sheet" class="sheet"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script>
    (function () {
      "use strict";
      var urlInput = document.getElementById("url");
      var ctaInput = document.getElementById("cta");
      var tableInput = document.getElementById("table");
      var sheet = document.getElementById("sheet");
      var settings = {};

      // Standaard: menuUrl uit config.js, anders de map waarin deze pagina staat.
      // (Cloudflare laat ".html" weg, dus zowel /qr als /qr.html afknippen.)
      var cfg = window.MENU_CONFIG || {};
      urlInput.value = cfg.menuUrl || (location.origin + location.pathname.replace(/qr(\.html)?$/, ""));

      function drawQr(canvas, text, scale) {
        var qr = qrcode(0, "M");
        qr.addData(text);
        qr.make();
        var count = qr.getModuleCount();
        var margin = 2;
        var size = (count + margin * 2) * scale;
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fbf7ef";
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = "#2b2118";
        for (var r = 0; r < count; r++) {
          for (var c = 0; c < count; c++) {
            if (qr.isDark(r, c)) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
          }
        }
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text) n.textContent = text;
        return n;
      }

      function render() {
        sheet.textContent = "";
        var url = urlInput.value.trim();
        if (!url) return;
        for (var i = 0; i < 4; i++) {
          var card = el("div", "card");
          card.appendChild(el("div", "orn", "❦"));
          card.appendChild(el("div", "name", settings.restoranadi || "Menü"));
          if (settings.altbaslik) card.appendChild(el("p", "sub", settings.altbaslik));
          var canvas = document.createElement("canvas");
          drawQr(canvas, url, 12);
          card.appendChild(canvas);
          card.appendChild(el("p", "cta", ctaInput.value));
          card.appendChild(el("div", "table", tableInput.value));
          sheet.appendChild(card);
        }
      }

      urlInput.addEventListener("input", render);
      ctaInput.addEventListener("input", render);
      tableInput.addEventListener("input", render);
      document.getElementById("print").addEventListener("click", function () { window.print(); });
      document.getElementById("download").addEventListener("click", function () {
        var canvas = document.createElement("canvas");
        drawQr(canvas, urlInput.value.trim(), 24);
        var a = document.createElement("a");
        a.download = "menu-qr.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      });

      window.MenuData.loadSettings()
        .then(function (s) { settings = s; })
        .catch(function () {})
        .then(render);
    })();
  </script>
</body>
</html>
